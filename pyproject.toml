[project]
name = "zhishi"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "python-multipart>=0.0.20", "pydantic>=2.9,<3", "python-ulid>=3,<4", "pymupdf>=1.24,<2", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "pillow>=11", "trafilatura>=2,<3", "httpx>=0.28,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7", "ruff>=0.12"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/python"]
addopts = "-q"
[tool.ruff]
line-length = 120
